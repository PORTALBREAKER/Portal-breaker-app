name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Java 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Prepare build environment and keys
      run: |
        # 1. Restore debug.keystore in root and app directory if missing
        if [ -f "debug.keystore.base64" ]; then
          base64 -d debug.keystore.base64 > debug.keystore
          mkdir -p app
          base64 -d debug.keystore.base64 > app/debug.keystore
          echo "debug.keystore successfully placed in both root and app folders."
        fi
        
        # 2. Ensure empty .env exists
        touch .env

        # 3. Grant execute permissions
        chmod +x gradlew

    - name: Build APK with Gradle
      env:
        ANDROID_HOME: /usr/local/lib/android/sdk
      run: ./gradlew assembleDebug --no-daemon -Djava.awt.headless=true -Pksp.useKSP2=true

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: PortalBreaker-APK
        path: app/build/outputs/apk/debug/*.apk
