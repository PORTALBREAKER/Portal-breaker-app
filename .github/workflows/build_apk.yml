name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Java 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Prepare build environment
      run: |
        # 1. Restore debug.keystore if missing (it was in .gitignore)
        if [ ! -f "debug.keystore" ] && [ -f "debug.keystore.base64" ]; then
          base64 -d debug.keystore.base64 > debug.keystore
          echo "debug.keystore successfully restored from base64."
        fi
        
        # 2. Ensure dummy .env file exists for secrets-gradle-plugin
        if [ ! -f ".env" ]; then
          touch .env
          echo "Created empty .env file."
        fi

        # 3. Ensure gradlew is executable
        chmod +x gradlew

    - name: Build APK with Gradle
      run: ./gradlew assembleDebug --no-daemon --stacktrace

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: PortalBreaker-APK
        path: app/build/outputs/apk/debug/*.apk
        if-no-files-found: error
