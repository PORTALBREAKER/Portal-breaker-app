name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Java 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Prepare build environment
      run: |
        # 1. Restore debug.keystore from base64 if missing
        if [ ! -f "debug.keystore" ] && [ -f "debug.keystore.base64" ]; then
          base64 -d debug.keystore.base64 > debug.keystore
          echo "debug.keystore successfully restored."
        fi
        
        # 2. Ensure empty .env exists
        if [ ! -f ".env" ]; then
          touch .env
          echo "Empty .env created."
        fi

        # 3. Grant execute permissions
        chmod +x gradlew

    - name: Build APK with Gradle
      env:
        ANDROID_HOME: /usr/local/lib/android/sdk
      run: ./gradlew assembleDebug --no-daemon

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: PortalBreaker-APK
        path: app/build/outputs/apk/debug/*.apk
