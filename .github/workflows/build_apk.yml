name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Java 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Prepare build environment and keystores
      run: |
        mkdir -p ~/.android
        mkdir -p app

        if [ -f "debug.keystore.base64" ]; then
          base64 -d debug.keystore.base64 > debug.keystore
          cp debug.keystore app/debug.keystore
          cp debug.keystore ~/.android/debug.keystore
        elif [ -f "app/debug.keystore.base64" ]; then
          base64 -d app/debug.keystore.base64 > debug.keystore
          cp debug.keystore app/debug.keystore
          cp debug.keystore ~/.android/debug.keystore
        else
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          cp debug.keystore app/debug.keystore
          cp debug.keystore ~/.android/debug.keystore
        fi

        echo "Keystores ready:"
        ls -la debug.keystore app/debug.keystore ~/.android/debug.keystore

        # Ensure .env files exist for Secrets Gradle Plugin
        touch .env
        touch app/.env

        # Ensure gradlew has executable permission
        chmod +x gradlew

    - name: Build Debug APK with Gradle
      env:
        ANDROID_HOME: /usr/local/lib/android/sdk
      run: |
        ./gradlew assembleDebug \
          --no-daemon \
          --no-configuration-cache \
          -Djava.awt.headless=true \
          -Pksp.useKSP2=true

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: PortalBreaker-Debug-APK
        path: app/build/outputs/apk/debug/*.apk
        if-no-files-found: error
